# Render Blueprint for the API. In Render: New > Blueprint > select this repo.
services:
  - type: web
    name: olti-portfolio-api
    runtime: node
    rootDir: server
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_KEY
        generateValue: true
